<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accents -->
    <radialGradient id="glowLeft" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowRight" cx="85%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </radialGradient>

    <!-- Border Stroke Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.6" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 900; font-size: 64px; letter-spacing: -1px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 19px; letter-spacing: 5px; fill: #94A3B8; text-transform: uppercase; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #E2E8F0; }
    .cli-text { font-family: 'Fira Code', 'Courier New', monospace; font-size: 15px; font-weight: 700; fill: #38BDF8; }
    .grid-line { stroke: #1E293B; stroke-opacity: 0.35; stroke-width: 1; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="380" rx="16" fill="url(#glowLeft)" />
  <rect width="1200" height="380" rx="16" fill="url(#glowRight)" />

  <!-- Subtle Cyber Grid -->
  <line x1="100" y1="0" x2="100" y2="380" class="grid-line" />
  <line x1="300" y1="0" x2="300" y2="380" class="grid-line" />
  <line x1="500" y1="0" x2="500" y2="380" class="grid-line" />
  <line x1="700" y1="0" x2="700" y2="380" class="grid-line" />
  <line x1="900" y1="0" x2="900" y2="380" class="grid-line" />
  <line x1="1100" y1="0" x2="1100" y2="380" class="grid-line" />
  <line x1="0" y1="95" x2="1200" y2="95" class="grid-line" />
  <line x1="0" y1="190" x2="1200" y2="190" class="grid-line" />
  <line x1="0" y1="285" x2="1200" y2="285" class="grid-line" />

  <!-- Outer Border Frame -->
  <rect x="2" y="2" width="1196" height="376" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Logo Icon Container (Left) -->
  <g transform="translate(80, 80)">
    <!-- Hexagon Outer Glow -->
    <polygon points="60,0 120,35 120,105 60,140 0,105 0,35" fill="#0F172A" stroke="#00E5FF" stroke-width="2.5" filter="drop-shadow(0 0 16px rgba(0,229,255,0.4))" />
    
    <!-- Rocket / Runner Symbol Inside -->
    <path d="M60 25 L88 75 L74 75 L82 110 L50 68 L64 68 Z" fill="url(#titleGrad)" filter="drop-shadow(0 0 8px rgba(56,189,248,0.6))" />
    <!-- Small Flutter-inspired Cyan Dash -->
    <path d="M42 90 L52 108 L34 108 Z" fill="#00E5FF" opacity="0.8" />
  </g>

  <!-- Typography Content (Center-Left) -->
  <g transform="translate(240, 105)">
    <!-- Subtitle (Top Kicker) -->
    <text x="0" y="20" class="subtitle">Universal AI Coding Skill For Flutter</text>

    <!-- Main Title -->
    <text x="0" y="85" class="title" fill="url(#titleGrad)">KRunner</text>

    <!-- CLI Badge Pill -->
    <g transform="translate(380, 42)">
      <rect x="0" y="0" width="190" height="42" rx="10" fill="#0A0F1D" stroke="#0284C7" stroke-width="1.5" />
      <circle cx="20" cy="21" r="5" fill="#22C55E" />
      <text x="35" y="26" class="cli-text">npx krunner</text>
    </g>

    <!-- Tagline description -->
    <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#94A3B8" font-weight="500">
      Zero Boilerplate • 100% Stateless • Clean Architecture • Anti-Slop Quality • Security Audited
    </text>
  </g>

  <!-- Bottom Pills / Feature Cards -->
  <g transform="translate(80, 280)">
    <!-- Pill 1: Flutter Standards -->
    <g transform="translate(0, 0)">
      <rect width="235" height="50" rx="10" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="26" cy="25" r="10" fill="#02569B" />
      <text x="21" y="29" font-family="sans-serif" font-size="12" fill="#FFF" font-weight="bold">⚡</text>
      <text x="46" y="24" class="badge-text" font-weight="700">100% Stateless</text>
      <text x="46" y="38" font-family="sans-serif" font-size="11" fill="#64748B">Provider &amp; BLoC Strict</text>
    </g>

    <!-- Pill 2: Clean Architecture -->
    <g transform="translate(260, 0)">
      <rect width="235" height="50" rx="10" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="26" cy="25" r="10" fill="#0891B2" />
      <text x="20" y="29" font-family="sans-serif" font-size="12" fill="#FFF" font-weight="bold">🏛️</text>
      <text x="46" y="24" class="badge-text" font-weight="700">Clean Architecture</text>
      <text x="46" y="38" font-family="sans-serif" font-size="11" fill="#64748B">Modular &amp; get_it Locator</text>
    </g>

    <!-- Pill 3: Anti-Slop Quality -->
    <g transform="translate(520, 0)">
      <rect width="245" height="50" rx="10" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="26" cy="25" r="10" fill="#4F46E5" />
      <text x="20" y="29" font-family="sans-serif" font-size="12" fill="#FFF" font-weight="bold">🧹</text>
      <text x="46" y="24" class="badge-text" font-weight="700">Anti-Slop Engine</text>
      <text x="46" y="38" font-family="sans-serif" font-size="11" fill="#64748B">No AI Generic Code &amp; UI</text>
    </g>

    <!-- Pill 4: Security Audit -->
    <g transform="translate(790, 0)">
      <rect width="250" height="50" rx="10" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="26" cy="25" r="10" fill="#DC2626" />
      <text x="20" y="29" font-family="sans-serif" font-size="12" fill="#FFF" font-weight="bold">🔒</text>
      <text x="46" y="24" class="badge-text" font-weight="700">Security Audit</text>
      <text x="46" y="38" font-family="sans-serif" font-size="11" fill="#64748B">Zero Hardcode &amp; SAST Gate</text>
    </g>
  </g>
</svg>
